name: Docker
# Only runs when something that affects the image changes, so ordinary PRs
# stay fast. Builds for the runner's platform without pushing.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
      - .github/workflows/docker.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
