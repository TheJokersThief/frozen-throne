name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v2
      - run: just fmt
      - run: just vet
      - run: just test
      - run: just build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - name: Validate OpenAPI spec
        run: just lint-api
      - name: Generated API types are up to date
        run: |
          just gen-api
          git diff --exit-code -- web/src/api/schema.d.ts
      - run: just web-typecheck
      - run: just web-test
      - run: just web-build
